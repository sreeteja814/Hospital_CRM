{% extends "base.html" %}
{% block title %}Set Password{% endblock %}
{% block content %}
<div class="page-header"><h5 class="mb-0">Set Password - {{ staff_member.username }}</h5></div>
<div class="card card-stat p-4">
<form method="post">
{% csrf_token %}
<div class="row">{% include "_form_fields.html" with form=form field_col=6 %}</div>
<button class="btn btn-primary mt-2">Update Password</button> <a href="{% url 'accounts:staff_list' %}" class="btn btn-outline-secondary mt-2">Cancel</a>
</form>
</div>
{% endblock %}
