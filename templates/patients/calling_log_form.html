{% extends "base.html" %}
{% block title %}Log Call{% endblock %}
{% block content %}
<div class="page-header"><h5 class="mb-0">Log Call {% if enquiry %}for {{ enquiry.patient_name }}{% elif patient %}for {{ patient.name }}{% endif %}</h5></div>
<div class="card card-stat p-4">
<form method="post">
{% csrf_token %}
<div class="row">{% include "_form_fields.html" with form=form field_col=4 %}</div>
<button class="btn btn-primary mt-2">Save Call Log</button>
</form>
</div>
{% endblock %}
